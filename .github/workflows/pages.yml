# Builds the site with MkDocs and publishes it to GitHub Pages (https://docs.finstats.no/).
#
#   push to main    → build, check, deploy
#   pull request    → build and check, nothing is published
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # The owner's rule for every fin* repository: no em-dash anywhere; the sentence is rewritten instead.
      - name: No em-dash
        run: "! git grep -n $'\\xe2\\x80\\x94'"
      # Strict: a broken link, a missing anchor or a page left out of the nav fails the build.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
